name: Client and Server CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Validate source and assets
        run: |
          npm run check
          node --check src/main.js
          node --check src/game/Game.js
          node --check src/game/assets.js
          node --check src/game/state/createGameState.js
          node --check src/game/simulation/commands.js
          node --check src/game/simulation/rng.js
          node --check src/game/simulation/GameSimulation.js
          node --check src/game/session/GameSession.js
          node --check src/game/session/protocol.js
          node --check src/game/session/LoopbackTransport.js
          node --check src/game/session/LocalSimulationHost.js
          node --check src/game/session/LocalGameSession.js
          node --check src/game/network/protocol.js
          node --check src/game/multiplayer/config.js
          node --check src/game/multiplayer/createMultiplayerBossState.js
          node --check src/game/multiplayer/MultiplayerBossSimulation.js
          node --check server/room/RoomCoordinator.js
          node --check server/room/AuthoritativeMatchHost.js
          node --check server/RaidRoom.js
          node --check server/worker.js
          node --check tests/simulation.test.js
          node --check tests/session.test.js
          node --check tests/room.test.js
          node --check tests/multiplayer-protocol.test.js
          node --check tests/worker.test.js
          node --check tests/raid-room.test.js
          node --check tests/authoritative-match-host.test.js
          node --check tests/multiplayer-simulation.test.js
          node --check scripts/verify-assets.mjs
          node --check scripts/verify-build.mjs
          node --check tests/smoke.spec.js
      - name: Test deterministic simulation
        run: npm run test:simulation
      - name: Test local session boundary
        run: npm run test:session
      - name: Test multiplayer room and protocol
        run: npm run test:room
      - name: Test authoritative multiplayer boss simulation
        run: npm run test:multiplayer-simulation
      - name: Test authoritative room host and integration
        run: npm run test:authoritative-room
      - name: Build client
        run: npm run build
      - name: Validate production output
        run: npm run verify:build
      - name: Build Cloudflare Worker
        run: npm run build:server
      - name: Smoke test Chromium
        run: npm run test:smoke
